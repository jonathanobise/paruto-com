<link rel="stylesheet" href="/styles.css">
<script>
  // Same appearance logic as the homepage: saved choice, else the system setting.
  (function () {
    var d = document.documentElement, pref = null;
    d.classList.remove('no-js');
    try { pref = localStorage.getItem('paruto-theme'); } catch (e) {}
    var theme = pref === 'light' || pref === 'dark' ? pref : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    d.setAttribute('data-theme', theme);
    document.getElementById('theme-color').setAttribute('content', theme === 'light' ? '#F5F3EF' : '#080808');
  })();
</script>
<style>
  .nf{position:relative;min-height:100svh;display:grid;place-items:center;overflow:hidden;padding:var(--s12) var(--gut);text-align:center;isolation:isolate}

  .nf__home{display:inline-flex;margin-bottom:var(--s2)}
  .nf__ctas{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:var(--s2)}
  .nf .lede{margin:0 auto}
</style>
</head>
